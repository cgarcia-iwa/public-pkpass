<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo pkpass</title>
  <style>
    :root { color-scheme: light dark; --bg: #f5f5f7; --fg: #1d1d1f; --muted: #6e6e73; --card: #fff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --fg: #f5f5f7; --muted: #a1a1a6; --card: #1c1c1e; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(420px, calc(100% - 32px)); background: var(--card); border-radius: 20px; padding: 32px 24px; text-align: center;
           box-shadow: 0 8px 30px rgba(0,0,0,.08); }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
    a.wallet { display: inline-flex; align-items: center; gap: 10px; background: #000; color: #fff; text-decoration: none;
               padding: 14px 24px; border-radius: 12px; font-weight: 600; font-size: 1rem; border: 1px solid #444; }
    small { display: block; margin-top: 20px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Pase de demostración</h1>
    <p>Abre esta página en Safari desde tu iPhone y toca el botón para ver el pase en Apple Wallet.</p>
    <a class="wallet" href="pass.pkpass" type="application/vnd.apple.pkpass">Agregar a Apple Wallet</a>
    <small id="hint"></small>
  </main>
  <script>
    if (!/iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent)) {
      document.getElementById('hint').textContent = 'Parece que no estás en un dispositivo Apple: el archivo se descargará en lugar de abrirse en Wallet.';
    }
  </script>
</body>
</html>
